name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamtv.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/streamtv.jks"
          else
            echo "::warning title=Unsigned build::Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets so in-app updates work."
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E '^e: |What went wrong|error:|Could not' -A4 build.log | head -c 7000 > errors.txt || true
            [ -s errors.txt ] || tail -n 60 build.log > errors.txt
          else
            echo "Failed before Gradle started (setup step)." > errors.txt
          fi
          python3 -c "import sys;t=open('errors.txt').read();print('::error title=Build failed::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamTV-apk
          path: app/build/outputs/apk/release/app-release.apk
      # The app's "Check for updates" button reads the latest release.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk StreamTV.apk
          gh release create "v${{ github.run_number }}" StreamTV.apk \
            --title "StreamTV 1.${{ github.run_number }}" \
            --notes "${COMMIT_MSG:-New build}"
